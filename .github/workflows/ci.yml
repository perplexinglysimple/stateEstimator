name: CI

on:
  push:
  pull_request:

jobs:
  c89-compat:
    name: C89 Compatibility (Library)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (gnu89 compatibility)
        run: cmake -S . -B build-gnu89 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-std=gnu89 -Werror -Wdeclaration-after-statement"

      - name: Build Library (gnu89 compatibility)
        run: cmake --build build-gnu89 --target stateEstimatorLib

  build-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Debug)
        run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug

      - name: Build (Debug)
        run: cmake --build build-debug --config Debug

      - name: Test (Debug)
        run: ctest --test-dir build-debug -C Debug --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compare filter outputs (Python)
        run: |
          python scripts/compare_filterpy.py --csv build-debug/ekf_filterpy_compare.csv --model linear
          python scripts/compare_filterpy.py --csv build-debug/ekf_filterpy_compare_nonlinear.csv --model nonlinear
          python scripts/compare_filterpy_bench.py --csv build-debug/ekf_bench_compare.csv
          python scripts/compare_filterpy_boat.py --csv build-debug/ekf_boat_compare.csv
          python scripts/compare_kalman.py --csv build-debug/kalman_filterpy_compare.csv

      - name: Configure (Release)
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build-release --config Release

      - name: Test (Release)
        run: ctest --test-dir build-release -C Release --output-on-failure

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr

      - name: Configure (Coverage)
        run: cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Build (Coverage)
        run: cmake --build build-coverage --config Debug

      - name: Coverage Report
        run: cmake --build build-coverage --target coverage

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            build-coverage/*.html
            build-coverage/*.xml
          if-no-files-found: error

  clang-format:
    name: Clang Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-14

      - name: Check formatting
        run: |
          clang-format-14 --version
          find inc src test -type f \( -name "*.c" -o -name "*.h" \) -print0 | xargs -0 clang-format-14 --dry-run --Werror

  docs:
    name: Generate Doxygen Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen + Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate docs
        run: doxygen Doxyfile

      - name: Upload Docs Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doxygen-docs
          path: docs/html
          if-no-files-found: error
